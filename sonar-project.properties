# SonarQube project configuration for Cali Joven
# This configuration is optimized for Azure VM deployment

# Project Information
sonar.projectKey=cali-joven
sonar.projectName=Cali Joven
sonar.projectVersion=1.0.0
sonar.organization=cali-joven-org

# Source Code Configuration
sonar.sources=src
sonar.tests=src/__test__
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__test__/**/*.ts

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.d.ts,**/*.min.js,**/*.bundle.js,**/*.config.js,**/*.config.ts

# Coverage Configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/__test__/**/*,**/*.d.ts,**/*.config.ts

# Duplicate Detection
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/__test__/**/*,**/*.d.ts

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript Configuration
sonar.typescript.tsconfigPath=tsconfig.json

# ESLint Configuration
sonar.eslint.reportPaths=eslint-report.json

# Quality Gate
sonar.qualitygate.wait=true

# Analysis Mode
sonar.analysis.mode=publish
sonar.issuesReport.console.enable=true

# Pull Request Configuration (commented out for SonarCloud Community Edition)
# sonar.pullrequest.provider=GitHub
# sonar.pullrequest.github.repository=cali-joven/sonar

# Branch Configuration (commented out for SonarCloud Community Edition)
# sonar.branch.name=main

# Security Configuration
sonar.security.realm=LDAP
sonar.authenticator.downcase=true
sonar.forceAuthentication=true

# Performance Configuration
sonar.ce.javaOpts=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError
sonar.web.javaOpts=-Xmx1g -XX:+HeapDumpOnOutOfMemoryError

# Logging Configuration
sonar.log.level=INFO
sonar.log.console=true

# Plugin Configuration
sonar.plugins.downloadOnlyRequired=true

# Search Configuration
sonar.search.javaOpts=-Xmx1g -XX:+HeapDumpOnOutOfMemoryError

# Additional Configuration
sonar.telemetry.enable=false
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

# Host Configuration (overridden in CI/CD)
# For local development: sonar.host.url=http://localhost:9000
# For Azure VM: sonar.host.url=http://YOUR_VM_IP:9000
# For SonarCloud: sonar.host.url=https://sonarcloud.io