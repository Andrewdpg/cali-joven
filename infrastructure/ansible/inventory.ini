[sonarqube]
# Azure VM for SonarQube
# This will be populated by the deployment script
sonarqube_vm ansible_host=REPLACE_WITH_VM_IP ansible_user=REPLACE_WITH_SSH_USER ansible_ssh_private_key_file=~/.ssh/id_rsa

[sonarqube:vars]
# Configuration for the sonarqube group
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_ssh_retries=3
ansible_ssh_timeout=30

# PostgreSQL Configuration (from Terraform outputs)
postgresql_fqdn=REPLACE_WITH_POSTGRESQL_FQDN
postgresql_database=sonar
postgresql_username=sonar
postgresql_password=REPLACE_WITH_POSTGRESQL_PASSWORD

# SonarQube Project Configuration
sonar_project_key=cali-joven
sonar_project_name=Cali Joven
sonar_create_project=true