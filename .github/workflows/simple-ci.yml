name: Simple CI - Tests & SonarQube

on:
  push:
    branches: [ main, develop, sonarq ]
  pull_request:
    branches: [ main, develop, sonarq ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  SONAR_PROJECT_KEY: 'cali-joven'
  SONAR_PROJECT_NAME: 'Cali Joven'

jobs:
  test-and-sonar:
    name: Test & SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || '' }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName="Cali Joven"
            -Dsonar.sources=src
            -Dsonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.d.ts
